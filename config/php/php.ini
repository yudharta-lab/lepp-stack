; ===== General PHP Settings =====
memory_limit = 2048M                   ; Batas memori maksimum untuk skrip PHP, cocok untuk Moodle dengan banyak pengguna
max_execution_time = 300               ; Maksimum waktu eksekusi skrip (detik)
post_max_size = 100M                   ; Batas maksimum ukuran data POST
upload_max_filesize = 100M             ; Ukuran maksimum file yang diunggah
max_input_vars = 5000                  ; Meningkatkan batas jumlah variabel input untuk menangani form kompleks di Moodle

; ===== Resource Moodle =====
realpath_cache_size = 4096k            ; Cache realpath untuk mengurangi beban file system
realpath_cache_ttl = 600               ; Waktu hidup cache realpath (detik)

; ===== Error Handling =====
log_errors = On                        ; Mengaktifkan logging error PHP
error_reporting = E_ALL                ; Melaporkan semua jenis error (E_ALL = 32767)
error_log = /var/logs/php/php_errors.log ; Lokasi file log error PHP

; ===== Opcache Settings =====
opcache.enable = 0                     ; Mengaktifkan opcache
opcache.memory_consumption = 512       ; Memori yang digunakan untuk opcache (dalam MB)
opcache.interned_strings_buffer = 16   ; Buffer string intern (dalam MB)
opcache.max_accelerated_files = 50000  ; Jumlah maksimum file yang di-cache
opcache.validate_timestamps = 1        ; Validasi timestamp file (gunakan 0 untuk produksi jika tidak ada perubahan kode)
opcache.revalidate_freq = 60           ; Interval untuk memeriksa perubahan file (detik)
opcache.max_wasted_percentage = 10     ; Persentase memori terbuang sebelum pengisian ulang cache
opcache.use_cwd = 1                    ; Cache berdasarkan direktori kerja saat ini
opcache.save_comments = 1              ; Simpan komentar PHP (dibutuhkan untuk kompatibilitas Moodle)
opcache.fast_shutdown = 1              ; Mempercepat shutdown request
opcache.enable_cli = 1                 ; Mengaktifkan opcache untuk CLI (berguna untuk command-line scripts)

; ===== Additional Logging =====
; Tambahkan jika ingin debugging lebih mendalam
log_errors_max_len = 1024              ; Panjang maksimum error log
display_errors = Off                   ; Matikan tampilan error untuk keamanan
display_startup_errors = Off           ; Matikan error startup untuk keamanan