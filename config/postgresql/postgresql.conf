# ======= General Settings =======
# Default configuration for PostgreSQL optimized for high-load environment

# ======= Connection Settings =======
listen_addresses = '*'                  # Listen on all addresses (0.0.0.0)
max_connections = 800                   # Maximum number of connections (equivalent to MySQL max_connections)
superuser_reserved_connections = 10     # Reserve connections for superuser


# ======= Memory Settings =======
# These are equivalent to MySQL's InnoDB settings
shared_buffers = 512MB                  # Shared memory for data cache (typically 1/4 of RAM, adapted from innodb_buffer_pool_size)
effective_cache_size = 2048MB           # Tells PostgreSQL how much RAM is available for caching (equivalent to innodb_buffer_pool_size)
maintenance_work_mem = 256MB            # Memory for VACUUM, CREATE INDEX, ALTER TABLE
work_mem = 3MB                          # Memory for individual operations like sort and hash (adapted from sort_buffer_size)

# ======= Temporary Tables =======
temp_buffers = 8MB                      # Temporary buffer memory
temp_file_limit = 4GB                   # Maximum size of temporary files

# ======= Checkpoint & WAL Settings =======
checkpoint_completion_target = 0.9      # Target for checkpoint
wal_buffers = 16MB                      # Write-ahead log buffer
default_statistics_target = 100         # Histogram buckets for ANALYZE
random_page_cost = 1.1                  # Cost of random page access
effective_io_concurrency = 8            # Number of parallel I/O operations

# ======= Query Performance Settings =======
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
jit = on                                # Just-in-time compilation for improved performance
jit_above_cost = 100000

# ======= Logging Settings =======
# Logging configuration for monitoring query performance
log_statement = 'none'                  # Log all/none/ddl/mod statements
log_min_duration_statement = 5000       # Log queries slower than 5 seconds (in ms)
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_statement_stats = off

# ======= Connection Timeout & Session =======
idle_in_transaction_session_timeout = 600000  # Timeout for idle transactions in ms (600 seconds)
tcp_keepalives_idle = 600
tcp_keepalives_interval = 30
tcp_keepalives_count = 5

# ======= Default Settings =======
# UTF-8 is PostgreSQL's default
# Note: server_encoding is set at database initialization and cannot be changed at runtime
client_encoding = 'UTF8'

# ======= Extension Loading =======
shared_preload_libraries = 'pg_stat_statements'

# ======= Cost Parameters for Query Planner =======
seq_page_cost = 1.0                     # Cost of sequential page access
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# ======= Autovacuum Settings =======
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ======= Parallel Query Execution =======
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ======= Transactions =======
default_transaction_isolation = 'read committed'
default_transaction_deferrable = off

# ======= Synchronous Commit =======
synchronous_commit = 'on'               # Ensure durability (similar to innodb_flush_log_at_trx_commit = 1)
