[supervisord]
nodaemon=true
logfile=/var/logs/supervisor/supervisord.log
pidfile=/var/logs/supervisor/supervisord.pid ; (supervisord pidfile;default supervisord.pid)

[program:php-fpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm
autostart=true
autorestart=true
numprocs=1
priority=1
user=www-data
stdout_logfile=/var/logs/supervisor/php-fpm-stdout.log
stderr_logfile=/var/logs/supervisor/php-fpm-stderr.log
redirect_stderr=true

