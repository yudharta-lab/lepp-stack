events {
	worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Keep Alive and TCP
    keepalive_timeout   65;
    keepalive_requests  1000;
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Buffers and Timeouts
    client_body_buffer_size     128k;
    client_max_body_size        20m;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 4k;
    output_buffers              1 32k;
    postpone_output             1460;
    client_header_timeout       60s;
    client_body_timeout         60s;
    send_timeout                60s;

    # redirect to ssl/https
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        server_name sim-bau.yudharta.ac.id sim-bau.dev;

        # make sure https
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate           /etc/nginx/ssl/code.crt;
        ssl_certificate_key       /etc/nginx/ssl/code.key;

        ssl_session_cache  builtin:1000  shared:SSL:10m;
        ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
        ssl_prefer_server_ciphers on;        

        # setup public directory & log files
        root /var/www/public;
        index index.php index.html;
        error_log  /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;

        # forward real ip address
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;

        # php resources request
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # static resources request ?
        location / {
            include  /etc/nginx/mime.types;
            try_files $uri $uri/ /index.php?$query_string;
            gzip_static on;
        }
    }

    # Reduce the data that needs to be sent over network -- for testing environment
    gzip on;
    gzip_min_length 10240;
    gzip_comp_level 1;
    gzip_vary on;
    gzip_disable msie6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/x-javascript application/json application/xml application/rss+xml application/atom+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}