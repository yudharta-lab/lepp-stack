services:
  app:
    build:
      context: .
      dockerfile: ./bin/php8/Dockerfile
      args:
        PUID: ${USER_UID}
        PGID: ${USER_GID}
    container_name: "${PROJECT_STACK_NAME}-php8"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus : "${APP_LIMITS_CPU}"
          memory: "${APP_LIMITS_MEMORY}"
    depends_on:
      - postgresql
    volumes:
      - ${APP_PATH}:/var/www:delegated
      - ./logs/php/:/var/logs/php
      - ./logs/supervisor/:/var/logs/supervisor/
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    networks:
      - app_network
      - local-dev-network
    ports:
      - "${VITE_PORT}:5173"
  web_server:
    image: 'nginx:1.29.3-alpine'
    container_name: "${PROJECT_STACK_NAME}-nginx"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus : "${WEB_SERVER_LIMITS_CPU}"
          memory: "${WEB_SERVER_LIMITS_MEMORY}"
    ports:
      - "${WEB_SERVER_UNSECURE_PORT}:80"
      - "${WEB_SERVER_SECURE_PORT}:443"
    volumes:
      - ${APP_PATH}:/var/www:rw
      - ./logs/nginx/:/var/log/nginx
      - ./config/ssl/:/etc/nginx/ssl
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - app_network
      - local-dev-network
  postgresql:
    image: 'postgres:16-alpine'
    container_name: "${PROJECT_STACK_NAME}-postgresql"
    restart: 'unless-stopped'
    ports:
      - "${POSTGRESQL_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c listen_addresses='*'"
    deploy:
      resources:
        limits:
          cpus : "${POSTGRESQL_LIMITS_CPU}"
          memory: "${POSTGRESQL_LIMITS_MEMORY}"
    volumes:
      - postgresql_data:/var/lib/postgresql/data:rw
      - ./logs/postgresql:/var/log/postgresql:rw
      - ./config/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - app_network
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
  redis_cache:
    image: 'redis:7.0.4-alpine3.16'
    container_name: "${PROJECT_STACK_NAME}-redis-cache"
    restart: "unless-stopped"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_LIMITS_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --logfile /var/log/redis/redis.log
    deploy:
      resources:
        limits:
          cpus : "${REDIS_LIMITS_CPU}"
          memory: "${REDIS_LIMITS_MEMORY}"
    volumes:
      - ./logs/redis:/var/log/redis:rw
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  local-dev-network:
    external: true

volumes:
  postgresql_data:
    driver: local
