services:
  app:
    build:
      context: .
      dockerfile: ./bin/frankenphp/Dockerfile
      args:
        PUID: ${USER_UID}
        PGID: ${USER_GID}
    container_name: "${PROJECT_STACK_NAME}-frankenphp"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          cpus : "${APP_LIMITS_CPU}"
          memory: "${APP_LIMITS_MEMORY}"
    depends_on:
      - postgresql
      - redis_cache
    ports:
      - "${WEB_SERVER_UNSECURE_PORT}:8000"
      - "${WEB_SERVER_SECURE_PORT}:8443"
      # forward hanya jika development
      # - "5173:5173"
    environment:
      OCTANE_WORKERS: ${OCTANE_WORKERS:-auto}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
    volumes:
      - ${APP_PATH}:/var/www:delegated
      - ./logs/php/:/var/logs/php
      - ./logs/supervisor/:/var/logs/supervisor/
      - ./logs/caddy/:/var/log/caddy/
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/php.ini
      - ./config/frankenphp/Caddyfile:/etc/caddy/Caddyfile
      - ./config/ssl/:/etc/caddy/ssl
    networks:
      - app_network
  postgresql:
    image: 'postgres:16-alpine'
    container_name: "${PROJECT_STACK_NAME}-postgresql"
    restart: 'unless-stopped'
    ports:
      - "${POSTGRESQL_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c listen_addresses='*'"
    deploy:
      resources:
        limits:
          cpus : "${POSTGRESQL_LIMITS_CPU}"
          memory: "${POSTGRESQL_LIMITS_MEMORY}"
    volumes:
      - postgresql_data:/var/lib/postgresql/data:rw
      - ./logs/postgresql:/var/log/postgresql:rw
      - ./config/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - app_network
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
  redis_cache:
    image: 'redis:7.0.4-alpine3.16'
    container_name: "${PROJECT_STACK_NAME}-redis-cache"
    restart: "unless-stopped"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_LIMITS_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --logfile /var/log/redis/redis.log
    deploy:
      resources:
        limits:
          cpus : "${REDIS_LIMITS_CPU}"
          memory: "${REDIS_LIMITS_MEMORY}"
    volumes:
      - ./logs/redis:/var/log/redis:rw
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  local-shared-network:
    external: true

volumes:
  postgresql_data:
    driver: local